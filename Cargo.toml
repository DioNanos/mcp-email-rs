[package]
name = "mcp-email-rs"
version = "0.3.2"
edition = "2024"
license = "Apache-2.0"
description = "Enterprise-grade Rust MCP email server with full IMAP support"
authors = ["DioNanos <dev@mmmbuto.com>"]
repository = "https://github.com/DioNanos/mcp-email-rs"
readme = "README.md"
keywords = ["mcp", "email", "imap", "smtp", "agent"]
categories = ["command-line-utilities", "email"]

[[bin]]
name = "mcp-email-rs"
path = "src/main.rs"

[dependencies]
# MCP SDK
rmcp = { version = "1.3", features = ["server", "macros", "transport-io"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# IMAP
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = "0.26"
webpki-roots = "0.26"

# SMTP
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder", "hostname"] }

# MIME parsing
mail-parser = "0.11"

# Connection pool
bb8 = "0.9"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config
dotenvy = "0.15"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Schema generation (must match rmcp's version)
schemars = "1.2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Async trait
async-trait = "0.1"

# Base64 for attachments
base64 = "0.22"

# Chrono for dates
chrono = "0.4"
futures-util = { version = "0.3.32", features = ["sink", "io"] }
rustls = { version = "0.23.37", default-features = false, features = ["ring"] }

# HMAC for CRAM-MD5
hmac = "0.12"
md-5 = "0.10"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
codegen-units = 1
